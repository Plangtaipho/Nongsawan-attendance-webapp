# Keeps the Render Free instance awake around the clock: a sleeping free instance
# failed to wake twice and needed a manual redeploy. Render sleeps after 15 idle
# minutes; this pings every 5 so a late or skipped GitHub run still leaves margin.
# About 744 of the 750 free instance hours a month, so this must be the only free
# Render service in the workspace. Public repo: Actions minutes are free.
name: Keep site awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health check
        run: |
          # A cold start can take about a minute, so allow up to ~3 minutes in total.
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://school-attendance-burk.onrender.com/healthz
