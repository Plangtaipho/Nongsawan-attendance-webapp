# Keeps the Render Free instance awake during school hours so teachers don't wait
# for a cold start. Render sleeps after 15 idle minutes; this pings every 10.
# Times are UTC: 00:00-09:50 UTC = 07:00-16:50 Thailand, every day (about 310 of the
# 750 free hours a month). Weekends too: a sleeping free instance once failed to wake.
# GitHub may start scheduled runs a few minutes late; the next run catches up.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 0-9 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health check
        run: |
          # A cold start can take about a minute, so allow up to ~3 minutes in total.
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://school-attendance-burk.onrender.com/healthz
