{% extends "base.html" %}
{% block title %}รายงานรายเทอม{% endblock %}
{% block content %}
<h1>รายงานการเข้าเรียนรายเทอม</h1>
<section class="card">
  <div class="grid grid-3">
    <div><label for="r-term">ภาคเรียน</label><select id="r-term"></select></div>
    <div><label for="r-room">ห้อง</label><select id="r-room"></select></div>
    <div><label for="r-subject">วิชา</label><select id="r-subject"></select></div>
  </div>
  <div class="actions mt-2">
    <button id="r-show" class="btn" type="button">แสดงรายงาน</button>
    <a id="r-print" class="btn btn-secondary hidden" target="_blank" rel="noopener">พิมพ์ / บันทึกเป็น PDF</a>
  </div>
</section>
<div id="r-loading" class="loading hidden">กำลังโหลด...</div>
<div id="r-result" class="hidden">
  <p id="r-caption" class="muted"></p>
  <div class="table-wrap">
    <table>
      <thead><tr><th>เลขที่</th><th>ชื่อ - สกุล</th><th class="num">มา</th><th class="num">ลา</th><th class="num">ขาด</th><th class="num">ร้อยละ</th></tr></thead>
      <tbody id="r-body"></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/reports.js?v=5"></script>{% endblock %}
