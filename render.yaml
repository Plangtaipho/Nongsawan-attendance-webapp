# Render Blueprint: one free web service running FastAPI (pages + API).
# The database is an external MySQL-compatible service; paste its URL into DATABASE_URL.
services:
  - type: web
    name: school-attendance
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    # Apply database migrations, then start the app behind Render's proxy.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENV
        value: production
      - key: TIMEZONE
        value: Asia/Bangkok
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: SCHOOL_NAME
        sync: false
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
